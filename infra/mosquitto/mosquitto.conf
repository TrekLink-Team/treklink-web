# Local development broker (gateway-sync task 3.1, broker side; the auth hooks are still open).
# Open listeners, no credentials: the Field Station credential is not checked here yet.
#
# Persistence keeps the backend's persistent session (MQTT_CLIENT_ID_BACKEND, clean session off)
# across a broker restart, so readings a Field Station flushes before the backend has reconnected
# are queued for it instead of dropped. Without it, a 25 s outage stored 0 of about 20 queued
# readings in 3 of 3 runs; with it, 20 of 20 (Mosquitto 2.0.18, fourth demo smoke, 2026-11-01).
# Mosquitto writes the store on a clean shutdown (`docker compose stop`) and every autosave_interval.

persistence true
persistence_location /mosquitto/data/

listener 1883
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true
