# Broker with credentials (gateway-sync task 3.1, design §4): mosquitto 2 with the mosquitto-go-auth
# plugin asking the backend's hooks (api-design 01 and 02) about every connection, publish and
# subscription. Opt in with docker-compose.broker-auth.yml (infra/mosquitto/README.md); the default
# mosquitto.conf stays open. Option names checked against the plugin's README and backends/http.go
# (https://github.com/iegomez/mosquitto-go-auth, read 2026-11-01; the repository is archived).
#
# go-auth's HTTP backend cannot add a request header, so it calls broker-hook-proxy, which adds
# X-Broker-Secret from MQTT_AUTH_HOOK_SECRET and forwards to the backend. The secret is in no file.

persistence true
persistence_location /mosquitto/data/

per_listener_settings false
allow_anonymous false

listener 1883

listener 9001
protocol websockets

auth_plugin /mosquitto/go-auth.so
auth_opt_backends http
auth_opt_log_level info

auth_opt_http_host broker-hook-proxy
auth_opt_http_port 8080
auth_opt_http_getuser_uri /api/internal/mqtt/user
auth_opt_http_aclcheck_uri /api/internal/mqtt/acl
auth_opt_http_params_mode json
# Status mode: any 2xx allows, anything else denies (the hooks answer 200, 401 or 403).
auth_opt_http_response_mode status
auth_opt_http_timeout 5
# No superuser: every client goes through the ACL hook (design §4 has no superuser row).
auth_opt_disable_superuser true

# The cache bounds how long a revoked station keeps a fresh connection to 60 s (design §4); the
# backend also drops a revoked username's messages at once (design §2 step 2). No refresh on hit, so
# an entry always expires on time.
auth_opt_cache true
auth_opt_auth_cache_seconds 60
auth_opt_acl_cache_seconds 60
auth_opt_cache_refresh false
