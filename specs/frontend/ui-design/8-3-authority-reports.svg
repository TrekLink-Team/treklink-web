<title id="title">8.3  Authority reports</title>
<desc id="desc">Existing /t/incidents, Authority reports tab | Staff and Admin | Report recording does not contact an authority. Desktop and exact 360 pixel mobile wireframes with form and recovery states. Illustrative API sample data, not live records.</desc>
