<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900"><title>System health</title><foreignObject x="0" y="0" width="1280" height="900"><div xmlns="http://www.w3.org/1999/xhtml" style="width:1280px;height:900px;overflow:hidden;font-family:system-ui, 'Segoe UI', Roboto, Arial, sans-serif"><style>

a{color:#0d6e5f}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:12px;font-weight:600;color:#5a6370;padding:10px 16px;background:#eef0f3;border-bottom:1px solid #dde1e7}
td{font-size:14px;padding:12px 16px;border-bottom:1px solid #e6e9ee}
</style><div style="width:1280px;height:900px;box-sizing:border-box;background:#f5f6f8;font-family:system-ui, 'Segoe UI', Roboto, Arial, sans-serif;color:#12161c;display:flex;flex-direction:column">
  <div style="height:56px;background:#12161c;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 32px;flex:none">
    <div style="font-weight:700;font-size:17px">TrekLink <span style="font-weight:500;color:#9aa3af;margin-left:8px">Admin</span></div>
    <div style="font-size:14px;color:#c9ced6">Nguyen Van A &#183; ADMIN</div>
  </div>
  <div style="display:flex;flex:1;min-height:0">
    <div style="width:220px;flex:none;background:#fff;border-right:1px solid #dde1e7;padding:20px 12px;display:flex;flex-direction:column;gap:4px;font-size:14px">
      <div style="padding:10px 12px;color:#3a424d">Accounts</div>
      <div style="padding:10px 12px;color:#3a424d">Roles and permissions</div>
      <div style="padding:10px 12px;color:#3a424d">Parameters</div>
      <div style="padding:10px 12px;color:#3a424d">Change log</div>
      <div style="padding:10px 12px;color:#3a424d">Sign-in log</div>
      <div style="background:#e3f1ee;color:#08493f;font-weight:600;padding:10px 12px;border-radius:8px">System health</div>
    </div>
    <div style="flex:1;padding:28px 32px;display:flex;flex-direction:column;gap:20px;min-width:0">
      <div style="display:flex;justify-content:space-between;align-items:flex-end">
        <div><h1 style="margin:0;font-size:24px;font-weight:700">System health</h1><div style="font-size:13px;color:#5a6370;margin-top:4px">Updated 10:15. Refreshes every 30 seconds.</div></div>
        <div style="display:flex;gap:10px;align-items:center"><div style="background:#fff;border:1px solid #c4cad3;border-radius:8px;padding:9px 14px;font-size:14px">Last 60 minutes</div><a href="#r" style="background:#fff;color:#12161c;border:1px solid #c4cad3;text-decoration:none;font-weight:600;font-size:14px;padding:10px 18px;border-radius:8px">Refresh</a></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px">
        <div style="background:#fff;border:1px solid #dde1e7;border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:8px">
          <div style="font-size:13px;color:#5a6370">Platform</div>
          <div><span style="font-size:13px;font-weight:700;background:#dff3e6;color:#14532d;border-radius:999px;padding:4px 12px">OK</span></div>
          <div style="font-size:13px;color:#3a424d;line-height:1.6">Database: UP<br/>MQTT broker: UP</div>
        </div>
        <div style="background:#fff;border:1px solid #dde1e7;border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:6px">
          <div style="font-size:13px;color:#5a6370">Ingestion</div>
          <div style="font-size:28px;font-weight:700">41.2 <span style="font-size:14px;font-weight:500;color:#5a6370">per minute</span></div>
          <div style="font-size:13px;color:#3a424d;line-height:1.6">Accepted 2,471 &#183; Duplicates 12<br/>Malformed 0 &#183; Unknown device 1</div>
        </div>
        <div style="background:#fff;border:1px solid #e5a29c;border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:6px">
          <div style="font-size:13px;color:#5a6370">Alert delivery</div>
          <div style="font-size:28px;font-weight:700;color:#7a1c13">1 failed</div>
          <div style="font-size:13px;color:#3a424d">0 pending</div>
          <a href="#f" style="font-size:13px;font-weight:600">View failed alerts</a>
        </div>
        <div style="background:#fff;border:1px solid #dde1e7;border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:6px">
          <div style="font-size:13px;color:#5a6370">Devices buffering</div>
          <div style="font-size:28px;font-weight:700">2</div>
          <div style="font-size:13px;color:#3a424d">Holding messages that have not reached a Field Station</div>
        </div>
      </div>
      <div style="background:#fff;border:1px solid #dde1e7;border-radius:12px;overflow:hidden">
        <div style="padding:16px 20px;border-bottom:1px solid #dde1e7;display:flex;gap:28px;align-items:baseline;flex-wrap:wrap">
          <div style="font-size:16px;font-weight:700">Field Stations</div>
          <div style="font-size:14px">6 total &#183; <span style="font-weight:600;color:#4a3000">1 stale</span> &#183; <span style="font-weight:600;color:#4a3000">1 outdated</span> &#183; current release 1.2.0</div>
          <div style="font-size:13px;color:#5a6370;margin-left:auto">Highest queue depth: p0 0 &#183; p1 0 &#183; p2 14 &#183; p3 230</div>
        </div>
        <table>
          <thead><tr><th>Station</th><th>Organization</th><th>Last sync</th><th>Queue depth p0 / p1 / p2 / p3</th><th>Oldest retry</th><th>Version</th></tr></thead>
          <tbody>
            <tr><td style="font-weight:600">Ta Nang basecamp laptop</td><td><a href="#o">ACME Trek Co., Ltd.</a></td><td>10:14</td><td>0 / 0 / 14 / 230</td><td>2</td><td>1.1.0 <span style="font-size:12px;font-weight:600;background:#fff4de;color:#4a3000;border-radius:999px;padding:3px 10px;margin-left:6px">Outdated</span></td></tr>
            <tr><td style="font-weight:600">[Station name]</td><td><a href="#o">[Organization]</a></td><td>09:41 <span style="font-size:12px;font-weight:600;background:#fff4de;color:#4a3000;border-radius:999px;padding:3px 10px;margin-left:6px">Stale</span></td><td>0 / 0 / 0 / 0</td><td>0</td><td>1.2.0 <span style="font-size:12px;color:#5a6370;margin-left:6px">Current</span></td></tr>
            <tr><td style="font-weight:600">[Station name]</td><td><a href="#o">[Organization]</a></td><td>10:15</td><td>0 / 0 / 0 / 0</td><td>0</td><td>1.2.0 <span style="font-size:12px;color:#5a6370;margin-left:6px">Current</span></td></tr>
          </tbody>
        </table>
        <div style="padding:10px 20px;font-size:12px;color:#5a6370">Revoked stations are not listed. With none registered this table reads: No Field Stations are registered yet.</div>
      </div>
    </div>
  </div>
</div></div></foreignObject></svg>
