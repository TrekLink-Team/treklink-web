<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900"><title>Device telemetry</title><foreignObject x="0" y="0" width="1280" height="900"><div xmlns="http://www.w3.org/1999/xhtml" style="width:1280px;height:900px;overflow:hidden;font-family:system-ui, 'Segoe UI', Roboto, Arial, sans-serif"><style>

a{color:#0d6e5f}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:12px;font-weight:600;color:#5a6370;padding:10px 16px;background:#eef0f3;border-bottom:1px solid #dde1e7}
td{font-size:14px;padding:10px 16px;border-bottom:1px solid #e6e9ee}
</style><div style="width:1280px;height:900px;box-sizing:border-box;background:#f5f6f8;font-family:system-ui, 'Segoe UI', Roboto, Arial, sans-serif;color:#12161c;display:flex;flex-direction:column">
  <div style="height:56px;background:#12161c;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 32px;flex:none">
    <div style="font-weight:700;font-size:17px">TrekLink</div>
    <div style="display:flex;gap:28px;font-size:14px;color:#c9ced6"><span>Live map</span><span>Incidents</span><span style="color:#fff;font-weight:600">Contracts</span><span>Members</span></div>
    <div style="font-size:14px;color:#c9ced6">Le Thi E &#183; ORG_OPERATOR</div>
  </div>
  <div style="padding:28px 32px;display:flex;flex-direction:column;gap:18px;flex:1;min-height:0">
    <div style="display:flex;justify-content:space-between;align-items:flex-end">
      <div><a href="#back" style="font-size:13px;font-weight:500">Back to contract RC-2026-0042</a><h1 style="margin:6px 0 0;font-size:24px;font-weight:700">TL-0042 telemetry</h1><div style="font-size:13px;color:#5a6370;margin-top:4px">/o/devices/:id/telemetry?from=&amp;to=</div></div>
      <a href="#csv" style="background:#fff;color:#12161c;border:1px solid #c4cad3;text-decoration:none;font-weight:600;font-size:14px;padding:10px 18px;border-radius:8px">Download CSV</a>
    </div>
    <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
      <div style="font-size:12px;color:#5a6370"><div style="margin-bottom:4px">From</div><div style="width:170px;background:#fff;border:1px solid #c4cad3;border-radius:8px;padding:9px 12px;font-size:14px;color:#12161c">20 Oct 2026, 00:00</div></div>
      <div style="font-size:12px;color:#5a6370"><div style="margin-bottom:4px">To</div><div style="width:170px;background:#fff;border:1px solid #c4cad3;border-radius:8px;padding:9px 12px;font-size:14px;color:#12161c">21 Oct 2026, 00:00</div></div>
      <div style="font-size:12px;color:#5a6370"><div style="margin-bottom:4px">Show</div><div style="display:flex;gap:14px;font-size:14px;color:#12161c;padding:9px 0"><span>&#9745; Positions</span><span>&#9745; Telemetry</span></div></div>
      <a href="#a" style="background:#0d6e5f;color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:11px 20px;border-radius:8px">Apply</a>
      <a href="#d" style="background:#fff;color:#12161c;border:1px solid #c4cad3;text-decoration:none;font-weight:500;font-size:13px;padding:9px 14px;border-radius:8px">Last 24 hours</a>
      <a href="#n" style="background:#fff;color:#12161c;border:1px solid #c4cad3;text-decoration:none;font-weight:500;font-size:13px;padding:9px 14px;border-radius:8px">Last 7 days</a>
    </div>
    <div style="background:#e3f1ee;border:1px solid #9fcfc5;border-radius:10px;padding:10px 14px;font-size:13px;color:#08493f">Showing 20 Oct 02:00 to 21 Oct 00:00, your rental period. The period is at most 7 days.</div>
    <div style="display:grid;grid-template-columns:1.6fr 1fr;gap:20px">
      <div style="background:#e6ece4;border:1px solid #dde1e7;border-radius:12px;height:300px;position:relative;overflow:hidden;background-image:linear-gradient(#dbe3d8 1px,transparent 1px),linear-gradient(90deg,#dbe3d8 1px,transparent 1px);background-size:56px 56px">
        <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="100%" height="300" viewBox="0 0 640 300" preserveAspectRatio="none" style="position:absolute;left:0;top:0"><polyline points="70,240 140,190 220,205 300,130 400,150 520,70" fill="none" stroke="#0d6e5f" stroke-width="4" stroke-linejoin="round"/><circle cx="70" cy="240" r="8" fill="#12161c"/><circle cx="520" cy="70" r="8" fill="#a8261b"/></svg>
        <div style="position:absolute;left:84px;top:244px;font-size:12px;font-weight:700;background:#fff;border-radius:6px;padding:2px 8px">Start 02:05</div>
        <div style="position:absolute;left:480px;top:34px;font-size:12px;font-weight:700;background:#fff;border-radius:6px;padding:2px 8px">End 10:15</div>
        <div style="position:absolute;right:10px;bottom:8px;font-size:11px;color:#3a424d;background:rgba(255,255,255,0.8);padding:2px 6px;border-radius:4px">&#169; OpenStreetMap contributors</div>
        <div style="position:absolute;left:12px;top:12px;font-size:11px;font-weight:600;background:rgba(255,255,255,0.9);border:1px solid #9aa3af;border-radius:6px;padding:3px 6px">Quan dao Hoang Sa (Viet Nam)</div>
      </div>
      <div style="background:#fff;border:1px solid #dde1e7;border-radius:12px;padding:18px 20px;height:300px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px">
        <div style="font-size:15px;font-weight:700">Battery over time</div>
        <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="100%" height="180" viewBox="0 0 400 180" preserveAspectRatio="none"><line x1="0" y1="179" x2="400" y2="179" stroke="#c4cad3"/><polyline points="0,20 80,32 160,60 240,100 320,130 400,160" fill="none" stroke="#0d6e5f" stroke-width="3"/></svg>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:#5a6370"><span>02:00, 96 %</span><span>10:15, 81 %</span></div>
        <div style="font-size:12px;color:#5a6370">The table below holds the same values.</div>
      </div>
    </div>
    <div style="background:#fff;border:1px solid #dde1e7;border-radius:12px;overflow:hidden">
      <table>
        <thead><tr><th>Time</th><th>Kind</th><th>Latitude</th><th>Longitude</th><th>Altitude (m)</th><th>Battery</th></tr></thead>
        <tbody>
          <tr><td>20 Oct 2026, 10:15</td><td><span style="font-size:12px;font-weight:600;background:#e1ecf8;color:#123a63;border-radius:999px;padding:3px 10px">POSITION</span></td><td>11.5601</td><td>108.5402</td><td>1320</td><td>81 %</td></tr>
          <tr><td>20 Oct 2026, 10:10</td><td><span style="font-size:12px;font-weight:600;background:#eceef1;color:#3a424d;border-radius:999px;padding:3px 10px">TELEMETRY</span></td><td style="color:#8a919c">None</td><td style="color:#8a919c">None</td><td style="color:#8a919c">None</td><td>82 %</td></tr>
        </tbody>
      </table>
      <div style="padding:10px 16px;font-size:13px;color:#5a6370;display:flex;justify-content:space-between"><span>2 points shown</span><span>Page 1 of 1</span></div>
    </div>
  </div>
</div></div></foreignObject></svg>
