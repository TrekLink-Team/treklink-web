<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" font-family="sans-serif" font-size="12" role="img" aria-label="Counter handover wireframe">
<title>Counter handover wireframe</title>
<rect width="100%" height="100%" fill="#ffffff"/><rect x="0" y="0" width="1040" height="48" fill="#1f2d3d" stroke="#1f2d3d"/><text fill="#ffffff" x="8" y="19.0" font-size="12">TrekLink   Counter</text><text x="24" y="84" font-size="18" font-weight="bold">Handover  RC-2026-0042  ACME Trek (ORG-0007)  APPROVED</text><text x="24" y="108" font-size="12" fill="#2b5fab">1 Devices   &gt;   2 Payment   &gt;   3 Preview note   &gt;   4 Sign</text><rect x="24" y="120" width="600" height="300" fill="#fafafa" stroke="#888"/><text x="36" y="144" font-size="13" font-weight="bold">Step 1  Devices (10 reserved, key version 1)</text><text x="36" y="162" font-size="11">Scan or type asset tag</text><rect x="36" y="168" width="300" height="28" fill="#ffffff" stroke="#888"/><text x="44" y="187" font-size="12" fill="#555">TL-0042</text><rect x="36" y="206" width="576" height="28" fill="#e6e6e6" stroke="#888"/><text x="44.0" y="224" font-size="12" font-weight="bold">Asset tag</text><text x="159.2" y="224" font-size="12" font-weight="bold">Provisioned</text><text x="274.4" y="224" font-size="12" font-weight="bold">Battery %</text><text x="389.6" y="224" font-size="12" font-weight="bold">GPS fix</text><text x="504.8" y="224" font-size="12" font-weight="bold"></text><rect x="36" y="234" width="576" height="28" fill="#ffffff" stroke="#cccccc"/><text x="44.0" y="252" font-size="12">TL-0042</text><text x="159.2" y="252" font-size="12">v1  yes</text><text x="274.4" y="252" font-size="12">96</text><text x="389.6" y="252" font-size="12">OK</text><text x="504.8" y="252" font-size="12"></text><rect x="36" y="262" width="576" height="28" fill="#ffffff" stroke="#cccccc"/><text x="44.0" y="280" font-size="12">TL-0043</text><text x="159.2" y="280" font-size="12">Record</text><text x="274.4" y="280" font-size="12">41</text><text x="389.6" y="280" font-size="12">OK</text><text x="504.8" y="280" font-size="12">Swap</text><rect x="36" y="290" width="576" height="28" fill="#ffffff" stroke="#cccccc"/><text x="44.0" y="308" font-size="12">TL-0044</text><text x="159.2" y="308" font-size="12">Record</text><text x="274.4" y="308" font-size="12"></text><text x="389.6" y="308" font-size="12">No fix</text><text x="504.8" y="308" font-size="12">Swap</text><rect x="36" y="330" width="576" height="30" fill="#fff3d6" stroke="#c9a227"/><text x="44" y="349.0" font-size="11">MSG19 Battery 41 %. Charge before use.   [ ] Proceed anyway (acknowledge)</text><rect x="36" y="368" width="576" height="30" fill="#fde2e2" stroke="#b42318"/><text x="44" y="387.0" font-size="11">MSG24 Provision this device with the organization's key before handover.</text><rect x="640" y="120" width="376" height="140" fill="#fafafa" stroke="#888"/><text x="652" y="144" font-size="13" font-weight="bold">Step 2  Payment</text><text x="652" y="168" font-size="12">First payment (holding fee) 2 250 000 VND</text><text x="652" y="190" font-size="12" font-weight="bold">Status: CONFIRMED (SePay sandbox)</text><text x="652" y="214" font-size="11" fill="#2b5fab">Unpaid: MSG23  &gt;  Record counter payment (6.3)</text><rect x="640" y="272" width="376" height="148" fill="#fafafa" stroke="#888"/><text x="652" y="296" font-size="13" font-weight="bold">Step 3  Preview note</text><rect x="652" y="306" width="352" height="100" fill="#eef3f8" stroke="#888"/><text x="660" y="325" font-size="12">PDF preview: organization, plan, term dates,</text><text x="660" y="345" font-size="12">every device by asset tag (no signature yet)</text><rect x="24" y="432" width="992" height="160" fill="#fafafa" stroke="#888"/><text x="36" y="456" font-size="13" font-weight="bold">Step 4  Sign</text><text x="36" y="474" font-size="11">Signing Manager</text><rect x="36" y="480" width="300" height="28" fill="#ffffff" stroke="#888"/><text x="44" y="499" font-size="12" fill="#555">Nguyen Van A  v</text><text x="36" y="530" font-size="11">Identity document checked</text><rect x="36" y="536" width="300" height="28" fill="#ffffff" stroke="#888"/><text x="44" y="555" font-size="12" fill="#555">CCCD ...4821</text><rect x="360" y="466" width="420" height="110" fill="#ffffff" stroke="#888"/><text x="368" y="485" font-size="12">Signature pad (draw with finger or mouse)</text><rect x="800" y="466" width="200" height="32" rx="4" fill="#ffffff" stroke="#2b5fab"/><text x="900.0" y="487.0" font-size="12" fill="#2b5fab" text-anchor="middle">Clear signature</text><rect x="800" y="520" width="200" height="32" rx="4" fill="#2b5fab" stroke="#2b5fab"/><text x="900.0" y="541.0" font-size="12" fill="#ffffff" text-anchor="middle">Complete handover</text><text x="24" y="610" font-size="11">Success: toast MSG06; contract ACTIVE, devices RENTED. Nothing is kept in the browser after submit.</text>
</svg>
