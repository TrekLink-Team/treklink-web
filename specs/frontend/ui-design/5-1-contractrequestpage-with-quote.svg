<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" font-family="sans-serif" font-size="12" role="img" aria-label="Request a contract wireframe">
<title>Request a contract wireframe</title>
<rect width="100%" height="100%" fill="#ffffff"/><rect x="0" y="0" width="1040" height="48" fill="#1f2d3d" stroke="#1f2d3d"/><text fill="#ffffff" x="8" y="19.0" font-size="12">TrekLink   Contracts</text><text x="24" y="84" font-size="18" font-weight="bold">Request a contract</text><text x="24" y="108" font-size="12" fill="#2b5fab">Step 1 Plan and devices   &gt;   Step 2 Start date   &gt;   Step 3 Review and send</text><rect x="24" y="124" width="470" height="400" fill="#fafafa" stroke="#888"/><text x="36" y="148" font-size="13" font-weight="bold">Step 1  Plan and devices</text><text x="40" y="172" font-size="11">Plan</text><rect x="40" y="180" width="140" height="32" rx="4" fill="#2b5fab" stroke="#2b5fab"/><text x="110.0" y="201.0" font-size="12" fill="#ffffff" text-anchor="middle">Monthly</text><rect x="190" y="180" width="140" height="32" rx="4" fill="#ffffff" stroke="#2b5fab"/><text x="260.0" y="201.0" font-size="12" fill="#2b5fab" text-anchor="middle">Day plan</text><text x="40" y="238" font-size="11">Day plan length (day plan only)</text><rect x="40" y="244" width="200" height="28" fill="#ffffff" stroke="#888"/><text x="48" y="263" font-size="12" fill="#555">4 days  v</text><text x="40" y="294" font-size="11">Hardware variant</text><rect x="40" y="300" width="430" height="28" fill="#ffffff" stroke="#888"/><text x="48" y="319" font-size="12" fill="#555">TrekLink v3 (GPS, SOS button)  450 000 VND / month  v</text><text x="40" y="350" font-size="11">Quantity</text><rect x="40" y="356" width="200" height="28" fill="#ffffff" stroke="#888"/><text x="48" y="375" font-size="12" fill="#555">10</text><text x="40" y="398" font-size="10" fill="#a33">MSG13 The minimum order is 5 devices.</text><rect x="370" y="474" width="110" height="32" rx="4" fill="#2b5fab" stroke="#2b5fab"/><text x="425.0" y="495.0" font-size="12" fill="#ffffff" text-anchor="middle">Next</text><rect x="512" y="124" width="504" height="400" fill="#fafafa" stroke="#888"/><text x="524" y="148" font-size="13" font-weight="bold">Quote (updates as you choose)</text><text x="528" y="172" font-size="12">Monthly plan, 10 x TrekLink v3</text><text x="528" y="196" font-size="12">Term fee per month         4 500 000 VND</text><text x="528" y="220" font-size="12" font-weight="bold">First payment (holding fee, 50 %)   2 250 000 VND</text><text x="528" y="244" font-size="12">Balance at each term end   2 250 000 VND</text><text x="528" y="276" font-size="11" fill="#555">Day plan instead:  450 000 / 30 x 1.5 x 4 x 8 = 720 000 VND, paid in full</text><rect x="528" y="296" width="472" height="30" fill="#eef3f8" stroke="#2b5fab"/><text x="536" y="315.0" font-size="11">Prices are fixed when you send the request.</text><text x="528" y="352" font-size="11">Step 2: Start date (handover day) [ 2026-10-25 ]   not in the past</text><text x="528" y="376" font-size="11">Step 3: Review the plan, variant, quantity, date and quote, then</text><rect x="528" y="392" width="200" height="32" rx="4" fill="#2b5fab" stroke="#2b5fab"/><text x="628.0" y="413.0" font-size="12" fill="#ffffff" text-anchor="middle">Send request</text><text x="528" y="446" font-size="11">Success: toast MSG14, then the contract page /o/contracts/:id</text><rect x="528" y="466" width="472" height="30" fill="#fff3d6" stroke="#c9a227"/><text x="536" y="485.0" font-size="11">MSG28 This cannot be done while it is SUSPENDED.</text><text x="24" y="552" font-size="11">360 px: steps stack; the quote collapses into a summary bar under the step and expands on tap.</text><text x="24" y="570" font-size="11">Org Manager only; Org Operators get MSG26.</text>
</svg>
