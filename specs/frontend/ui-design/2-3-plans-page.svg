    </div>
    <div style="display:flex;gap:12px">
      <a href="#register" style="background:#0d6e5f;color:#fff;text-decoration:none;font-weight:600;font-size:15px;padding:14px 24px;border-radius:8px">Register your organization</a>
      <a href="#how" style="background:#fff;color:#12161c;border:1px solid #c4cad3;text-decoration:none;font-weight:600;font-size:15px;padding:13px 24px;border-radius:8px">How renting works</a>
