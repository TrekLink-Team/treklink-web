  <div style="padding:56px 48px 0;display:flex;flex-direction:column;gap:28px">
    <div style="display:flex;flex-direction:column;gap:14px;max-width:760px">
      <h1 style="margin:0;font-size:40px;line-height:1.15;font-weight:700">Rent LoRa mesh safety devices for your treks</h1>
      <p style="margin:0;font-size:17px;line-height:1.55;color:#3a424d">TrekLink gives trekking organizations a monthly or day-plan rental of mesh devices with GPS and an SOS button, and a live map and incident queue for the people on duty.</p>
    </div>
    <div style="display:flex;gap:16px;align-items:flex-start;background:#fff4de;border:1px solid #d9a441;border-radius:10px;padding:18px 20px;max-width:760px">
