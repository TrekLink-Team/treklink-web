      <div style="display:flex;flex-direction:column;gap:10px"><div style="width:36px;height:36px;border-radius:50%;background:#0d6e5f;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center">2</div><div style="font-weight:600;font-size:16px">Get verified</div><div style="font-size:14px;line-height:1.5;color:#3a424d">Visit the TrekLink counter so staff can verify you.</div></div>
