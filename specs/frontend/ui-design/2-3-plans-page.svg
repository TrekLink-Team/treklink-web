a{color:#0d6e5f}a:hover{color:#08493f}
</style><div style="width:1280px;min-height:1180px;box-sizing:border-box;background:#f5f6f8;font-family:system-ui, 'Segoe UI', Roboto, Arial, sans-serif;color:#12161c;display:flex;flex-direction:column">
