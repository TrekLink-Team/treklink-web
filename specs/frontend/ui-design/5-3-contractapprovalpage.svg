t="500" fill="#fafafa" stroke="#888"/><text x="612" y="88" font-size="13" font-weight="bold">RC-2026-0042   REQUESTED</text><text x="612" y="110" font-size="11">ACME Trek Co., Ltd. (ORG-0007)</text><text x="612" y="128" font-size="11">Monthly, treklink-v3 x 10, start 2026-10-25</text><text x="612" y="146" font-size="11">450 000 VND / device / month, fixed at request</text><rect x="612" y="160" width="392" height="30" fill="#e5f4ea" stroke="#2e7d4f"/><text x="620" y="179.0" font-size="11">Available now: 14 treklink-v3 (advisory; checked at approval)</text><rect x="612" y="198" width="392" height="30" fill="#fde2e2" stroke="#b42318"/><text x="620" y="217.0" font-size="11">MSG11 Only 7 treklink-v3 devices are available. Lower ...</text><text x="612" y="252" font-size="11">Handover appointment</text><rect x="612" y="258" width="260" height="28" fill="#ffffff" stroke="#888"/><text x="620" y="277" font-size="12" fill="#555">2026-10-25  09:00</text><text x="612" y="302" font-size="10" fill="#555">Devices are reserved by the server, oldest checked first.</text><rect x="612" y="320" width="120" height="32" rx="4" fill="#ffffff" stroke="#2b5fab"/><text x="672.0" y="341.0" font-size="12" fill="#2b5fab" text-anchor="middle">Reject</text><rect x="884" y="320" width="120" height="32" rx="4" fill="#2b5fab" stroke="#2b5fab"/><text x="944.0" y="341.0" font-size="12" fill="#ffffff" text-anchor="middle">Approve</text><rect x="612" y="386" width="392" height="160" fill="#ffffff" stroke="#888"/><text x="624" y="410" font-size="13" font-weight="bold">Reject (dialog)</text><text x="624" y="430" font-size="11">Reason shown to the Manager</text><rect x="624" y="436" width="368" height="28" fill="#ffffff" stroke="#888"/><text x="632" y="455" font-size="12" fill="#555">treklink-v4 is out of stock until November.</text><rect x="764" y="494" width="110" height="32" rx="4" fill="#ffffff" stroke="#2b5fab"/><text x="819.0" y="515.0" font-size="12" fill="#2b5fab" text-anchor="middle">Cancel</text><rect x="882" y="494" width="110" height="32" rx="4" fill="#2b5fab" stroke="#2b5fab"/><text x="937.0" y="515.0" font-size="12" fill="#ffffff" text-anchor="middle">Reject</text><text x="24" y="300" font-size="11">Approve: devices RESERVED, contract APPROVED,</text><text x="24" y="318" font-size="11">reservation expiry set; toast MSG03, row leaves the queue.</text><text x="24" y="336" font-size="11">Reject: Manager sees MSG16 with the reason.</text><text x="24" y="354" font-size="11"></text><text x="24" y="372" font-size="11">360 px: rows become cards; the detail opens</text><text x="24" y="390" font-size="11">as its own view with full-width buttons.</text>
