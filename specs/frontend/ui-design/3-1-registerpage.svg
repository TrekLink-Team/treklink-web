<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" font-family="sans-serif" font-size="12" role="img" aria-label="RegisterPage wireframe">
<title>RegisterPage wireframe</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="0" y="0" width="1040" height="48" fill="#1f2d3d" stroke="#1f2d3d"/><text fill="#ffffff" x="8" y="29" font-size="12">TrekLink   Register your organization</text>

<text x="24" y="84" font-size="18" font-weight="bold">Register an organization</text>

<rect x="24" y="110" width="492" height="420" fill="#fafafa" stroke="#2b5fab" stroke-width="2"/>
<rect x="24" y="110" width="492" height="32" fill="#2b5fab"/><text x="36" y="131" fill="#ffffff" font-size="13" font-weight="bold">Step 1 of 2: Company</text>
<text x="40" y="168" font-size="12">Legal name *</text><rect x="40" y="174" width="440" height="28" fill="#ffffff" stroke="#888"/>
<text x="40" y="218" font-size="12">Tax code *</text><rect x="40" y="224" width="440" height="28" fill="#ffffff" stroke="#888"/><text x="40" y="266" font-size="10" fill="#888">10 or 13 digits</text>
<text x="40" y="294" font-size="12">Address *</text><rect x="40" y="300" width="440" height="28" fill="#ffffff" stroke="#888"/>
<text x="40" y="344" font-size="12">Contact phone *</text><rect x="40" y="350" width="440" height="28" fill="#ffffff" stroke="#888"/>
<rect x="400" y="470" width="80" height="32" rx="4" fill="#2b5fab" stroke="#2b5fab"/><text x="440" y="491" text-anchor="middle" fill="#ffffff">Next &gt;</text>

<rect x="524" y="110" width="492" height="420" fill="#fafafa" stroke="#888"/>
<rect x="524" y="110" width="492" height="32" fill="#e6e6e6"/><text x="536" y="131" font-size="13" font-weight="bold">Step 2 of 2: Manager contact</text>
<text x="540" y="168" font-size="12">Manager full name *</text><rect x="540" y="174" width="440" height="28" fill="#ffffff" stroke="#888"/>
<text x="540" y="218" font-size="12">Manager email *</text><rect x="540" y="224" width="440" height="28" fill="#ffffff" stroke="#888"/><text x="540" y="266" font-size="10" fill="#888">becomes the Manager's login</text>
<text x="540" y="294" font-size="12">Manager phone *</text><rect x="540" y="300" width="440" height="28" fill="#ffffff" stroke="#888"/>
<rect x="900" y="110" width="0" height="0"/>
<rect x="540" y="470" width="80" height="32" rx="4" fill="#ffffff" stroke="#2b5fab"/><text x="580" y="491" text-anchor="middle" fill="#2b5fab">&lt; Back</text>
<rect x="836" y="470" width="128" height="32" rx="4" fill="#2b5fab" stroke="#2b5fab"/><text x="900" y="491" text-anchor="middle" fill="#ffffff">Register</text>

<rect x="24" y="548" width="992" height="52" fill="#fff8e1" stroke="#c9a227"/>
<text x="36" y="568" font-size="11">TrekLink does not replace official search-and-rescue channels.</text>
<text x="36" y="584" font-size="11">Your organization remains responsible for its own emergency response. (NFR-LEG-05)</text>

</svg>
