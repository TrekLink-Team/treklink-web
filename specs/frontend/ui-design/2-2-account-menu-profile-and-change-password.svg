<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" font-family="sans-serif" font-size="12" role="img" aria-label="Account menu: profile and change password wireframe">
<title>Account menu: profile and change password wireframe</title>
<rect width="100%" height="100%" fill="#ffffff"/><rect x="0" y="0" width="1040" height="48" fill="#1f2d3d" stroke="#1f2d3d"/><text fill="#ffffff" x="8" y="19.0" font-size="12">TrekLink   Live map</text><text x="1016" y="30" font-size="12" fill="#ffffff" text-anchor="end">Nguyen Van A  (menu open)</text><text x="24" y="84" font-size="11" fill="#555">(any page of the workspace)</text><rect x="700" y="52" width="316" height="236" fill="#ffffff" stroke="#888"/><text x="716" y="78" font-size="12" font-weight="bold">Nguyen Van A</text><text x="716" y="98" font-size="11">manager@acme-trek.vn</text><text x="716" y="118" font-size="11">Org Manager</text><text x="716" y="138" font-size="11">ACME Trek Co., Ltd.  ORG-0007  ACTIVE</text><text x="716" y="158" font-size="10" fill="#555">TrekLink accounts: Admin or Staff, no organization line</text><rect x="716" y="176" width="284" height="32" rx="4" fill="#ffffff" stroke="#2b5fab"/><text x="858.0" y="197.0" font-size="12" fill="#2b5fab" text-anchor="middle">Change password</text><rect x="716" y="222" width="284" height="32" rx="4" fill="#ffffff" stroke="#2b5fab"/><text x="858.0" y="243.0" font-size="12" fill="#2b5fab" text-anchor="middle">Sign out</text><rect x="220" y="300" width="420" height="280" fill="#fafafa" stroke="#888"/><text x="232" y="324" font-size="13" font-weight="bold">Change password</text><text x="236" y="348" font-size="11">Current password</text><rect x="236" y="354" width="388" height="28" fill="#ffffff" stroke="#888"/><text x="244" y="373" font-size="12" fill="#555">********</text><text x="236" y="396" font-size="10" fill="#a33">The current password is incorrect.</text><text x="236" y="418" font-size="11">New password</text><rect x="236" y="424" width="388" height="28" fill="#ffffff" stroke="#888"/><text x="244" y="443" font-size="12" fill="#555">********</text><text x="236" y="474" font-size="11">Confirm new password</text><rect x="236" y="480" width="388" height="28" fill="#ffffff" stroke="#888"/><text x="244" y="499" font-size="12" fill="#555">********</text><rect x="436" y="520" width="90" height="32" rx="4" fill="#ffffff" stroke="#2b5fab"/><text x="481.0" y="541.0" font-size="12" fill="#2b5fab" text-anchor="middle">Cancel</text><rect x="534" y="520" width="90" height="32" rx="4" fill="#2b5fab" stroke="#2b5fab"/><text x="579.0" y="541.0" font-size="12" fill="#ffffff" text-anchor="middle">Change</text><text x="680" y="330" font-size="11">Profile is read-only: no endpoint edits name or email.</text><text x="680" y="348" font-size="11">Success: toast with the server message, dialog closes.</text><text x="680" y="366" font-size="11">Other sessions of the account are signed out.</text><text x="680" y="384" font-size="11"></text><text x="680" y="402" font-size="11">360 px: the menu opens as a full-width sheet;</text><text x="680" y="420" font-size="11">the dialog opens full screen.</text>
