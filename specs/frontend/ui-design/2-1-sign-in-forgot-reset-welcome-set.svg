<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" font-family="sans-serif" font-size="12" role="img" aria-label="Sign-in, forgot, reset, welcome wireframe">
<title>Sign-in, forgot, reset, welcome wireframe</title>
<rect width="100%" height="100%" fill="#ffffff"/><rect x="0" y="0" width="1040" height="48" fill="#1f2d3d" stroke="#1f2d3d"/><text fill="#ffffff" x="8" y="19.0" font-size="12">TrekLink   Sign in</text><rect x="16" y="64" width="240" height="470" fill="#fafafa" stroke="#888"/><text x="28" y="88" font-size="13" font-weight="bold">Sign in  /sign-in</text><rect x="272" y="64" width="240" height="470" fill="#fafafa" stroke="#888"/><text x="284" y="88" font-size="13" font-weight="bold">Forgot password  /forgot</text><rect x="528" y="64" width="240" height="470" fill="#fafafa" stroke="#888"/><text x="540" y="88" font-size="13" font-weight="bold">Reset password  /reset</text><rect x="784" y="64" width="240" height="470" fill="#fafafa" stroke="#888"/><text x="796" y="88" font-size="13" font-weight="bold">Welcome, set password  /welcome</text><rect x="28" y="100" width="216" height="30" fill="#fde2e2" stroke="#b42318"/><text x="36" y="119.0" font-size="11">MSG09 Incorrect email or password.</text><text x="28" y="150" font-size="11">Email</text><rect x="28" y="156" width="216" height="28" fill="#ffffff" stroke="#888"/><text x="36" y="175" font-size="12" fill="#555">manager@acme-trek.vn</text><text x="28" y="206" font-size="11">Password</text><rect x="28" y="212" width="216" height="28" fill="#ffffff" stroke="#888"/><text x="36" y="231" font-size="12" fill="#555">********</text><text x="178" y="232" font-size="10" fill="#2b5fab">Show</text><rect x="28" y="254" width="216" height="32" rx="4" fill="#2b5fab" stroke="#2b5fab"/><text x="136.0" y="275.0" font-size="12" fill="#ffffff" text-anchor="middle">Sign in</text><text x="28" y="310" font-size="11" fill="#2b5fab">Forgot password?</text><text x="28" y="346" font-size="10">Locked (423): server message,</text><text x="28" y="364" font-size="10">button stays enabled.</text><text x="284" y="108" font-size="11">Enter your account email. A code</text><text x="284" y="126" font-size="11">is sent if it is registered.</text><text x="284" y="152" font-size="11">Email</text><rect x="284" y="158" width="216" height="28" fill="#ffffff" stroke="#888"/><text x="292" y="177" font-size="12" fill="#555">manager@acme-trek.vn</text><rect x="284" y="200" width="216" height="32" rx="4" fill="#2b5fab" stroke="#2b5fab"/><text x="392.0" y="221.0" font-size="12" fill="#ffffff" text-anchor="middle">Send code</text><rect x="284" y="248" width="216" height="30" fill="#eef3f8" stroke="#2b5fab"/><text x="292" y="267.0" font-size="11">If the email is registered, a code...</text><text x="284" y="300" font-size="11" fill="#2b5fab">I have a code: enter it</text><text x="284" y="320" font-size="11" fill="#2b5fab">Back to sign in</text><text x="540" y="112" font-size="11">Email</text><rect x="540" y="118" width="216" height="28" fill="#ffffff" stroke="#888"/><text x="548" y="137" font-size="12" fill="#555">manager@acme-trek.vn</text><text x="540" y="168" font-size="11">Code (6 digits)</text><rect x="540" y="174" width="216" height="28" fill="#ffffff" stroke="#888"/><text x="548" y="193" font-size="12" fill="#555">482913</text><text x="540" y="216" font-size="10" fill="#a33">MSG08 This code is invalid or has expired.</text><text x="540" y="238" font-size="11">New password</text><rect x="540" y="244" width="216" height="28" fill="#ffffff" stroke="#888"/><text x="548" y="263" font-size="12" fill="#555">********</text><text x="540" y="294" font-size="11">Confirm new password</text><rect x="540" y="300" width="216" height="28" fill="#ffffff" stroke="#888"/><text x="548" y="319" font-size="12" fill="#555">********</text><rect x="540" y="342" width="216" height="32" rx="4" fill="#2b5fab" stroke="#2b5fab"/><text x="648.0" y="363.0" font-size="12" fill="#ffffff" text-anchor="middle">Reset password</text><text x="540" y="396" font-size="11" fill="#2b5fab">Send a new code</text><text x="796" y="108" font-size="11">Set the first password of your</text><text x="796" y="126" font-size="11">invited account.</text><text x="796" y="152" font-size="11">Email</text><rect x="796" y="158" width="216" height="28" fill="#ffffff" stroke="#888"/><text x="804" y="177" font-size="12" fill="#555">operator@acme-trek.vn</text><text x="796" y="208" font-size="11">Invitation code</text><rect x="796" y="214" width="216" height="28" fill="#ffffff" stroke="#888"/><text x="804" y="233" font-size="12" fill="#555">739104</text><text x="796" y="264" font-size="11">Password</text><rect x="796" y="270" width="216" height="28" fill="#ffffff" stroke="#888"/><text x="804" y="289" font-size="12" fill="#555">********</text><text x="796" y="320" font-size="11">Confirm password</text><rect x="796" y="326" width="216" height="28" fill="#ffffff" stroke="#888"/><text x="804" y="345" font-size="12" fill="#555">********</text><rect x="796" y="368" width="216" height="32" rx="4" fill="#2b5fab" stroke="#2b5fab"/><text x="904.0" y="389.0" font-size="12" fill="#ffffff" text-anchor="middle">Set password and sign in</text><text x="16" y="562" font-size="11">360 px: one card per page, full width, inputs and buttons 44 px high. Confirm fields are checked in the browser and never sent.</text><text x="16" y="580" font-size="11">After sign-in or welcome (D-059): ?next= wins, else Org Manager /o/contracts (later /o), Org Operator /o/map, TrekLink /t/map.</text>
</svg>
