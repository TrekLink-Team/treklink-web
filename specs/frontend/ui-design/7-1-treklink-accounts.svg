    <div style="font-size:14px;color:#c9ced6">Nguyen Van A &#183; ADMIN</div>
  </div>
  <div style="display:flex;flex:1;min-height:0">
    <div style="width:220px;flex:none;background:#fff;border-right:1px solid #dde1e7;padding:20px 12px;display:flex;flex-direction:column;gap:4px;font-size:14px">
      <div style="background:#e3f1ee;color:#08493f;font-weight:600;padding:10px 12px;border-radius:8px">Accounts</div>
      <div style="padding:10px 12px;color:#3a424d">Roles and permissions</div>
      <div style="padding:10px 12px;color:#3a424d">Parameters</div>
      <div style="padding:10px 12px;color:#3a424d">Change log</div>
      <div style="padding:10px 12px;color:#3a424d">Sign-in log</div>
      <div style="padding:10px 12px;color:#3a424d">System health</div>
