        <h1 style="margin:0;font-size:24px;font-weight:700">TrekLink accounts</h1>
        <a href="#new" style="background:#0d6e5f;color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:11px 20px;border-radius:8px">New account</a>
      </div>
      <div style="display:flex;gap:12px;align-items:center">
        <div style="width:300px;background:#fff;border:1px solid #c4cad3;border-radius:8px;padding:10px 14px;font-size:14px;color:#6b7482">Search name or email</div>
        <div style="background:#fff;border:1px solid #c4cad3;border-radius:8px;padding:10px 14px;font-size:14px">Status: All</div>
        <a href="#clear" style="font-size:14px;font-weight:500;margin-left:4px">Clear filters</a>
      </div>
      <div style="background:#fff;border:1px solid #dde1e7;border-radius:12px;overflow:hidden">
        <table>
          <thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Last sign-in</th><th>Created</th><th style="text-align:right">Actions</th></tr></thead>
          <tbody>
            <tr>
              <td><div style="font-weight:600">Nguyen Van A <span style="font-weight:400;color:#5a6370">(you)</span></div><div style="font-size:13px;color:#5a6370">admin@treklink.vn &#183; 0901 000 111</div></td>
              <td><span style="font-size:12px;font-weight:600;background:#e8e4f7;color:#3d2c80;border-radius:999px;padding:4px 10px">ADMIN</span></td>
              <td><span style="font-size:12px;font-weight:600;background:#dff3e6;color:#14532d;border-radius:999px;padding:4px 10px">ACTIVE</span></td>
              <td>21 Oct 2026, 08:02</td><td>01 Oct 2026</td>
              <td style="text-align:right;font-size:13px;color:#8a919c">Edit &#183; <span title="">Deactivate</span></td>
            </tr>
            <tr>
              <td><div style="font-weight:600">Tran Thi B</div><div style="font-size:13px;color:#5a6370">staff1@treklink.vn &#183; 0901 234 567</div></td>
              <td><span style="font-size:12px;font-weight:600;background:#e1ecf8;color:#123a63;border-radius:999px;padding:4px 10px">STAFF</span></td>
              <td><span style="font-size:12px;font-weight:600;background:#dff3e6;color:#14532d;border-radius:999px;padding:4px 10px">ACTIVE</span></td>
              <td>20 Oct 2026, 10:15</td><td>20 Oct 2026</td>
              <td style="text-align:right;font-size:13px;font-weight:500"><a href="#e">Edit</a> &#183; <a href="#r">Send reset code</a> &#183; <a href="#d" style="color:#a8261b">Deactivate</a></td>
            </tr>
            <tr>
              <td><div style="font-weight:600">Le Van C</div><div style="font-size:13px;color:#5a6370">staff2@treklink.vn &#183; None</div></td>
              <td><span style="font-size:12px;font-weight:600;background:#e1ecf8;color:#123a63;border-radius:999px;padding:4px 10px">STAFF</span></td>
              <td><span style="font-size:12px;font-weight:600;background:#fff4de;color:#4a3000;border-radius:999px;padding:4px 10px">Invitation pending</span></td>
              <td>Never</td><td>21 Oct 2026</td>
              <td style="text-align:right;font-size:13px;font-weight:500"><a href="#e">Edit</a> &#183; <a href="#r">Send reset code</a> &#183; <a href="#d" style="color:#a8261b">Deactivate</a></td>
            </tr>
            <tr>
              <td><div style="font-weight:600;color:#5a6370">Pham Thi D</div><div style="font-size:13px;color:#5a6370">staff3@treklink.vn &#183; 0912 345 678</div></td>
              <td><span style="font-size:12px;font-weight:600;background:#e1ecf8;color:#123a63;border-radius:999px;padding:4px 10px">STAFF</span></td>
              <td><span style="font-size:12px;font-weight:600;background:#eceef1;color:#3a424d;border-radius:999px;padding:4px 10px">DEACTIVATED</span></td>
