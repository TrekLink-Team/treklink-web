              <td style="text-align:right;font-size:13px;font-weight:500"><a href="#e">Edit</a> &#183; <a href="#re">Reactivate</a></td>
            </tr>
          </tbody>
        </table>
        <div style="padding:12px 16px;font-size:13px;color:#5a6370;display:flex;justify-content:space-between"><span>4 accounts</span><span>Page 1 of 1</span></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
        <div style="background:#fff;border:1px solid #dde1e7;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px">
          <div style="font-size:16px;font-weight:700">New account</div>
          <div style="display:grid;grid-template-columns:1fr 1fr 150px;gap:10px;font-size:13px">
            <div><div style="color:#5a6370;margin-bottom:4px">Email</div><div style="border:1px solid #c4cad3;border-radius:8px;padding:9px 12px;color:#6b7482">name@treklink.vn</div></div>
            <div><div style="color:#5a6370;margin-bottom:4px">Full name</div><div style="border:1px solid #c4cad3;border-radius:8px;padding:9px 12px;color:#6b7482">Full name</div></div>
            <div><div style="color:#5a6370;margin-bottom:4px">Role</div><div style="border:1px solid #c4cad3;border-radius:8px;padding:9px 12px">STAFF</div></div>
          </div>
          <div style="font-size:12px;color:#5a6370">An invitation code is emailed. Nobody sets another person's password.</div>
        </div>
        <div style="background:#fff;border:1px solid #dde1e7;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px">
          <div style="font-size:16px;font-weight:700">Deactivate Nguyen Van A?</div>
          <div style="background:#fdeceb;border:1px solid #e5a29c;border-radius:8px;padding:10px 12px;font-size:13px;color:#7a1c13">At least one active Admin must remain.</div>
          <div style="font-size:13px;color:#5a6370">Sessions end at once. A reason is required.</div>
        </div>
