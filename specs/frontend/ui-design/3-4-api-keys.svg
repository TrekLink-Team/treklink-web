<text x="48" y="744" fill="#172b26" font-family="Arial, sans-serif" font-size="17" font-weight="700">Revoke API key ERP integration?</text>
<text x="48" y="786" fill="#172b26" font-family="Arial, sans-serif" font-size="13" font-weight="400">Requests that use tlk_7Hc2 get 401 from the next request,</text>
<text x="48" y="806" fill="#172b26" font-family="Arial, sans-serif" font-size="13" font-weight="400">and an open stream with it is closed. This cannot be undone.</text>
