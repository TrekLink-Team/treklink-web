<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="460" viewBox="0 0 1040 460" font-family="sans-serif" font-size="12" role="img" aria-label="API keys wireframe">
<title>API keys wireframe</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="0" y="0" width="1040" height="48" fill="#1f2d3d" stroke="#1f2d3d"/><text fill="#ffffff" x="8" y="29" font-size="12">TrekLink   Organization administration / API keys</text>

<text x="24" y="84" font-size="18" font-weight="bold">API keys</text>
<rect x="880" y="64" width="136" height="32" rx="4" fill="#2b5fab"/><text x="948" y="85" text-anchor="middle" fill="#ffffff" font-size="12">Create a key</text>

<rect x="24" y="110" width="992" height="26" fill="#e6e6e6" stroke="#888"/><text x="32" y="128" font-size="11" font-weight="bold">Name</text><text x="320" y="128" font-size="11" font-weight="bold">Prefix</text><text x="520" y="128" font-size="11" font-weight="bold">Created</text><text x="720" y="128" font-size="11" font-weight="bold">Last used</text><text x="900" y="128" font-size="11" font-weight="bold">Status</text>
<rect x="24" y="136" width="992" height="28" fill="#ffffff" stroke="#cccccc"/><text x="32" y="155" font-size="11">ERP integration</text><text x="320" y="155" font-size="11">tlk_7Hc2...</text><text x="520" y="155" font-size="11">2026-10-20</text><text x="720" y="155" font-size="11">never</text><rect x="900" y="141" width="80" height="18" fill="#ffffff" stroke="#b33"/><text x="940" y="154" text-anchor="middle" fill="#b33" font-size="9">Revoke</text>

<rect x="260" y="200" width="520" height="200" fill="#fafafa" stroke="#2b5fab" stroke-width="2"/>
<text x="280" y="228" font-size="13" font-weight="bold">API key created</text>
<text x="280" y="252" font-size="11">Copy it now. It will not be shown again.</text>
<rect x="280" y="266" width="440" height="32" fill="#ffffff" stroke="#888"/><text x="290" y="287" font-size="11">tlk_7Hc2Qm8f...kY2p (full key)</text>
<rect x="280" y="310" width="90" height="28" rx="4" fill="#2b5fab"/><text x="325" y="329" text-anchor="middle" fill="#ffffff" font-size="11">Copy</text>
<rect x="640" y="310" width="80" height="28" rx="4" fill="#ffffff" stroke="#888"/><text x="680" y="329" text-anchor="middle" font-size="11">Done</text>
</svg>
