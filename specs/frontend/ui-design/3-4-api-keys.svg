<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1420" viewBox="0 0 1600 1420" role="img" aria-labelledby="title desc">
<title id="title">3.4  API keys</title>
<desc id="desc">Wireframes for the API keys page with the create dialog, the one-time key dialog, the revoke confirmation, the key limit refusal, the empty list and the 360 pixel mobile layouts. Illustrative sample data, not live records.</desc>
<rect x="0" y="0" width="1600" height="1420" rx="0" fill="#f1f5f9" stroke="#f1f5f9"/>
<text x="28" y="38" fill="#172b26" font-family="Arial, sans-serif" font-size="26" font-weight="700">3.4  API keys</text>
<text x="28" y="66" fill="#475569" font-family="Arial, sans-serif" font-size="14" font-weight="400">Route /o/api-keys | Org Manager | Desktop views above, dialogs and 360 px mobile below</text>
<text x="28" y="1402" fill="#172b26" font-family="Arial, sans-serif" font-size="13" font-weight="400">TanNB | SD | 29 Oct 2026 | Illustrative API sample data (api-design 20 to 22); alternate states are separate views.</text>
