<text x="44" y="520" fill="#475569" font-family="Arial, sans-serif" font-size="13" font-weight="400">The list keeps the first 8 characters of each key. The full key cannot be shown again.</text>
<text x="44" y="542" fill="#475569" font-family="Arial, sans-serif" font-size="13" font-weight="400">At 5 of 5 the Create API key button is disabled. An Org Operator who opens this route sees MSG26.</text>
