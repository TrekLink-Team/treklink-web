<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" font-family="sans-serif" font-size="12" role="img" aria-label="SePay payment wireframe">
<title>SePay payment wireframe</title>
<rect width="100%" height="100%" fill="#ffffff"/><rect x="0" y="0" width="1040" height="48" fill="#1f2d3d" stroke="#1f2d3d"/><text fill="#ffffff" x="8" y="19.0" font-size="12">TrekLink   Invoices</text><rect x="0" y="48" width="1040" height="30" fill="#fff3d6" stroke="#c9a227"/><text x="8" y="67.0" font-size="11">Sandbox payment: no real money moves. Payments made here stay labelled sandbox.</text><text x="24" y="112" font-size="18" font-weight="bold">Pay with SePay   INV-2026-000123</text><rect x="24" y="132" width="420" height="380" fill="#fafafa" stroke="#888"/><text x="36" y="156" font-size="13" font-weight="bold">Scan with your banking app</text><rect x="94" y="172" width="280" height="240" fill="#ffffff" stroke="#888"/><text x="102" y="191" font-size="12">VietQR image (vietQr.imageUrl)</text><text x="40" y="440" font-size="12" fill="#2b5fab">Waiting for SePay to confirm...  (checks every 5 s)</text><text x="40" y="462" font-size="11">QR valid until 10:45</text><rect x="460" y="132" width="556" height="236" fill="#fafafa" stroke="#888"/><text x="472" y="156" font-size="13" font-weight="bold">Transfer details</text><text x="476" y="180" font-size="13">Amount            2 250 000 VND</text><text x="476" y="198" font-size="13">For               Holding fee, term 1</text><text x="476" y="216" font-size="13">Account           SANDBOX-0001</text><text x="476" y="234" font-size="13">Transfer content  TL7K2Q9M4D</text><text x="476" y="252" font-size="13">Status            PENDING   SANDBOX</text><text x="476" y="290" font-size="11" fill="#555">Keep the transfer content exactly as shown.</text><text x="476" y="316" font-size="11" fill="#2b5fab">Back to the invoice</text><rect x="460" y="384" width="556" height="40" fill="#e5f4ea" stroke="#2e7d4f"/><text x="468" y="408.0" font-size="11">MSG20 Payment of 2 250 000 VND received.</text><rect x="460" y="436" width="556" height="40" fill="#fde2e2" stroke="#b42318"/><text x="468" y="460.0" font-size="11">MSG25 Payment not completed. Nothing was charged. 2 250 000 VND remains due.</text><rect x="460" y="486" width="200" height="32" rx="4" fill="#2b5fab" stroke="#2b5fab"/><text x="560.0" y="507.0" font-size="12" fill="#ffffff" text-anchor="middle">Create a new QR code</text><text x="24" y="540" font-size="11">360 px: the QR fills the width (at least 240 px), details below, buttons full width.</text><text x="24" y="558" font-size="11">Polling stops on CONFIRMED or EXPIRED, and when the page is left.</text>
</svg>
