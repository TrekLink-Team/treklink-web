<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1470" viewBox="0 0 1600 1470" role="img" aria-labelledby="title desc">
<title id="title">8.2  Staff incident queue</title>
<desc id="desc">Existing /t/incidents | Staff and Admin | Selected detail stays inside this route. Desktop and exact 360 pixel mobile wireframes with form and recovery states. Illustrative API sample data, not live records.</desc>
<rect x="0" y="0" width="1600" height="1470" rx="0" fill="#f1f5f9" stroke="#f1f5f9"/>
<text x="28" y="38" fill="#172b26" font-family="Arial, sans-serif" font-size="26" font-weight="700">8.2  Staff incident queue</text>
<text x="28" y="66" fill="#475569" font-family="Arial, sans-serif" font-size="14" font-weight="400">Existing /t/incidents | Staff and Admin | Selected detail stays inside this route</text>
<text x="28" y="1452" fill="#172b26" font-family="Arial, sans-serif" font-size="13" font-weight="400">HoangTK | SD handoff | 23 Oct 2026 | Illustrative API data; alternate states are separate views. See Markdown for permissions and H-01 to H-06.</text>
