<text x="1216" y="700" fill="#172b26" font-family="Arial, sans-serif" font-size="18" font-weight="700">INC-2026-000045</text>
<rect x="1216" y="718" width="86" height="28" rx="14" fill="#fef2f2" stroke="#fef2f2"/>
<text x="1226" y="737" fill="#991b1b" font-family="Arial, sans-serif" font-size="12" font-weight="700">UNROUTED</text>
<text x="1216" y="775" fill="#172b26" font-family="Arial, sans-serif" font-size="14" font-weight="400">TL-0042 / CONFIRMED</text>
<text x="1216" y="802" fill="#172b26" font-family="Arial, sans-serif" font-size="14" font-weight="400">Owner: TrekLink Staff queue</text>
<rect x="1216" y="823" width="296" height="44" rx="8" fill="white" stroke="#172b26"/>
<text x="1228" y="851" fill="#172b26" font-family="Arial, sans-serif" font-size="14" font-weight="700">Inspect incident</text>
<text x="1200" y="924" fill="#172b26" font-family="Arial, sans-serif" font-size="14" font-weight="400">Selected detail replaces this list. Back to queue</text>
<text x="1200" y="944" fill="#172b26" font-family="Arial, sans-serif" font-size="14" font-weight="400">restores the row and scroll position.</text>
<text x="1200" y="1014" fill="#172b26" font-family="Arial, sans-serif" font-size="14" font-weight="400">TrekLink reports to authorities; it does not</text>
<text x="1200" y="1034" fill="#172b26" font-family="Arial, sans-serif" font-size="14" font-weight="400">coordinate rescue.</text>
<text x="28" y="816" fill="#172b26" font-family="Arial, sans-serif" font-size="20" font-weight="700">Selected incident action variants</text>
<rect x="28" y="837" width="540" height="112" rx="8" fill="#fef2f2" stroke="#cbd5e1"/>
<text x="44" y="862" fill="#991b1b" font-family="Arial, sans-serif" font-size="15" font-weight="700">UNROUTED</text>
<text x="44" y="887" fill="#991b1b" font-family="Arial, sans-serif" font-size="13" font-weight="400">Primary: Record authority report. Secondary: Declare false alarm, with required reason</text>
<text x="44" y="906" fill="#991b1b" font-family="Arial, sans-serif" font-size="13" font-weight="400">and explicit confirmation.</text>
<rect x="590" y="837" width="558" height="112" rx="8" fill="#fffbeb" stroke="#cbd5e1"/>
<text x="606" y="862" fill="#92400e" font-family="Arial, sans-serif" font-size="15" font-weight="700">ESCALATED</text>
<text x="606" y="887" fill="#92400e" font-family="Arial, sans-serif" font-size="13" font-weight="400">Primary: Record authority report. Retain the organization&#x27;s owner name if returned. No</text>
<text x="606" y="906" fill="#92400e" font-family="Arial, sans-serif" font-size="13" font-weight="400">Staff false-alarm action.</text>
<rect x="28" y="973" width="540" height="272" rx="8" fill="white" stroke="#cbd5e1"/>
<text x="48" y="1007" fill="#172b26" font-family="Arial, sans-serif" font-size="20" font-weight="700">Declare false alarm?</text>
<text x="48" y="1037" fill="#172b26" font-family="Arial, sans-serif" font-size="15" font-weight="700">INC-2026-000045 / TL-0042</text>
<text x="48" y="1074" fill="#172b26" font-family="Arial, sans-serif" font-size="13" font-weight="700">Reason *</text>
<rect x="48" y="1084" width="500" height="66" rx="8" fill="white" stroke="#cbd5e1"/>
<text x="60" y="1110" fill="#475569" font-family="Arial, sans-serif" font-size="13" font-weight="400">Holder confirmed safe; explain the false alarm.</text>
<rect x="48" y="1187" width="220" height="44" rx="8" fill="white" stroke="#991b1b"/>
<text x="60" y="1215" fill="#991b1b" font-family="Arial, sans-serif" font-size="14" font-weight="700">Declare false alarm</text>
<rect x="284" y="1187" width="130" height="44" rx="8" fill="white" stroke="#172b26"/>
<text x="296" y="1215" fill="#172b26" font-family="Arial, sans-serif" font-size="14" font-weight="700">Cancel</text>
<rect x="590" y="973" width="558" height="126" rx="8" fill="#fffbeb" stroke="#cbd5e1"/>
<text x="606" y="998" fill="#92400e" font-family="Arial, sans-serif" font-size="15" font-weight="700">State changed while editing</text>
<text x="606" y="1023" fill="#92400e" font-family="Arial, sans-serif" font-size="13" font-weight="400">MSG28: refresh current state and remove invalid action. MSG36: Reload preserves the</text>
<text x="606" y="1042" fill="#92400e" font-family="Arial, sans-serif" font-size="13" font-weight="400">reason; a new submit is deliberate. No automatic POST retry.</text>
<rect x="590" y="1119" width="558" height="126" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="606" y="1144" fill="#172b26" font-family="Arial, sans-serif" font-size="15" font-weight="700">Empty / denied / disconnected</text>
<text x="606" y="1169" fill="#172b26" font-family="Arial, sans-serif" font-size="13" font-weight="400">No unrouted or escalated incidents need attention. Filtered empty uses MSG01. MSG26</text>
<text x="606" y="1188" fill="#172b26" font-family="Arial, sans-serif" font-size="13" font-weight="400">clears inaccessible records. MSG32 labels cached data stale.</text>
<rect x="28" y="1273" width="1120" height="124" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="44" y="1298" fill="#172b26" font-family="Arial, sans-serif" font-size="15" font-weight="700">Read-only evidence and contract boundaries</text>
<text x="44" y="1323" fill="#172b26" font-family="Arial, sans-serif" font-size="13" font-weight="400">Transitions, episode events and delivery attempts are GETs. Organization and contract links use returned IDs, without inventing labels. Keep server pagination/order; H-01 requests</text>
<text x="44" y="1342" fill="#172b26" font-family="Arial, sans-serif" font-size="13" font-weight="400">sorting. Reconnect and refetch never erase a dirty form.</text>
<rect x="1184" y="1120" width="360" height="184" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="1200" y="1145" fill="#172b26" font-family="Arial, sans-serif" font-size="15" font-weight="700">Access boundary</text>
<text x="1200" y="1170" fill="#172b26" font-family="Arial, sans-serif" font-size="13" font-weight="400">Organization roles receive MSG26 here. Admin inherits</text>
<text x="1200" y="1189" fill="#172b26" font-family="Arial, sans-serif" font-size="13" font-weight="400">Staff. Staff alert actions open the queue, not an</text>
<text x="1200" y="1208" fill="#172b26" font-family="Arial, sans-serif" font-size="13" font-weight="400">acknowledgement mutation.</text>
</svg>
