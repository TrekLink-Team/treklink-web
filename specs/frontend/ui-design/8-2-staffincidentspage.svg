<text x="590" y="507" fill="#172b26" font-family="Arial, sans-serif" font-size="16" font-weight="700">INC-2026-000045 | UNROUTED</text>
<text x="590" y="536" fill="#172b26" font-family="Arial, sans-serif" font-size="14" font-weight="400">Last position 11.5601, 108.5402</text>
<text x="590" y="564" fill="#172b26" font-family="Arial, sans-serif" font-size="14" font-weight="400">Routing: inspect transition reason</text>
