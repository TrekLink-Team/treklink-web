<text x="866" y="614" fill="#991b1b" font-family="Arial, sans-serif" font-size="14" font-weight="700">Declare false alarm</text>
<text x="590" y="666" fill="#172b26" font-family="Arial, sans-serif" font-size="14" font-weight="700">Transitions  /  Episode events  /  Alert delivery</text>
<text x="590" y="697" fill="#475569" font-family="Arial, sans-serif" font-size="13" font-weight="400">View organization / contract only when IDs exist</text>
<text x="590" y="724" fill="#475569" font-family="Arial, sans-serif" font-size="13" font-weight="400">Staff never take the organization response owner role.</text>
<text x="1184" y="118" fill="#172b26" font-family="Arial, sans-serif" font-size="17" font-weight="700">360 px / Staff queue</text>
