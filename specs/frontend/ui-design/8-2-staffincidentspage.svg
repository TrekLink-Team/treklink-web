<text x="1200" y="514" fill="#172b26" font-family="Arial, sans-serif" font-size="13" font-weight="700">Device ID / Created from</text>
<rect x="1200" y="524" width="328" height="44" rx="8" fill="white" stroke="#cbd5e1"/>
<text x="1212" y="550" fill="#475569" font-family="Arial, sans-serif" font-size="13" font-weight="400">Stacked optional fields</text>
