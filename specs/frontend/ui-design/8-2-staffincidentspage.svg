<text x="44" y="672" fill="#475569" font-family="Arial, sans-serif" font-size="14" font-weight="400">Page 1 / returned total   |   Previous / Next</text>
<text x="44" y="711" fill="#172b26" font-family="Arial, sans-serif" font-size="14" font-weight="400">No manual Create, Escalate, Reopen or Resolve control. State transitions</text>
<text x="44" y="731" fill="#172b26" font-family="Arial, sans-serif" font-size="14" font-weight="400">remain on the server.</text>
