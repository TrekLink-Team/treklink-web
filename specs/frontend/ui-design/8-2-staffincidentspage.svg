<text x="60" y="189" fill="#991b1b" font-family="Arial, sans-serif" font-size="15" font-weight="700">Escalated incident (MSG34)</text>
<text x="60" y="214" fill="#991b1b" font-family="Arial, sans-serif" font-size="13" font-weight="400">TrekLink records and reports incidents. It does not coordinate rescue operations. Staff use Open queue; no organization acknowledgement.</text>
