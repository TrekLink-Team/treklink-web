e="11">[ ] Case cracked     500 000 VND</text><text x="692" y="292" font-size="11">Note</text><rect x="692" y="298" width="304" height="28" fill="#ffffff" stroke="#888"/><text x="700" y="317" font-size="12" fill="#555">Antenna snapped at the base</text><text x="692" y="352" font-size="10" fill="#555">Above the approval threshold: charge waits</text><text x="692" y="368" font-size="10" fill="#555">for an Admin who is not the inspector (6.4).</text><rect x="896" y="392" width="100" height="32" rx="4" fill="#2b5fab" stroke="#2b5fab"/><text x="946.0" y="413.0" font-size="12" fill="#ffffff" text-anchor="middle">Record</text><rect x="24" y="462" width="480" height="176" fill="#fafafa" stroke="#888"/><text x="36" y="486" font-size="13" font-weight="bold">Replacement (dialog, running contract)</text><text x="36" y="498" font-size="11">Faulty TL-0042  &gt;  replacement [ TL-0077 (available, v3)  v ]</text><text x="36" y="518" font-size="11">[x] Faulty unit is here (checked in now)   Key version 2 written</text><rect x="36" y="530" width="300" height="70" fill="#ffffff" stroke="#888"/><text x="44" y="549" font-size="12">Manager signature pad</text><rect x="352" y="568" width="140" height="32" rx="4" fill="#2b5fab" stroke="#2b5fab"/><text x="422.0" y="589.0" font-size="12" fill="#ffffff" text-anchor="middle">Replace device</text><rect x="520" y="462" width="496" height="176" fill="#fafafa" stroke="#888"/><text x="532" y="486" font-size="13" font-weight="bold">Close (contract RETURNED)</text><text x="532" y="498" font-size="12">Devices: 8 back, 0 lost unsettled</text><text x="532" y="518" font-size="12">Balance due 0 VND, damage charges pending: 0</text><text x="532" y="538" font-size="12">Open incidents: checked by the server</text><rect x="532" y="552" width="472" height="30" fill="#fde2e2" stroke="#b42318"/><text x="540" y="571.0" font-size="11">MSG29 This cannot be done while it has open incidents.</text><rect x="864" y="596" width="140" height="32" rx="4" fill="#2b5fab" stroke="#2b5fab"/><text x="934.0" y="617.0" font-size="12" fill="#ffffff" text-anchor="middle">Close contract</text>
