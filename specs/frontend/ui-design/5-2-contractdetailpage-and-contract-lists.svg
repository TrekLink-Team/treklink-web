04.0" y="314" font-size="12">Label</text><rect x="572" y="334" width="140" height="32" rx="4" fill="#2b5fab" stroke="#2b5fab"/><text x="642.0" y="355.0" font-size="12" fill="#ffffff" text-anchor="middle">Give notice</text><rect x="722" y="334" width="150" height="32" rx="4" fill="#ffffff" stroke="#2b5fab"/><text x="797.0" y="355.0" font-size="12" fill="#2b5fab" text-anchor="middle">Handover note (PDF)</text><rect x="882" y="334" width="122" height="32" rx="4" fill="#ffffff" stroke="#2b5fab"/><text x="943.0" y="355.0" font-size="12" fill="#2b5fab" text-anchor="middle">Cancel</text><text x="572" y="386" font-size="10" fill="#555">Notice: monthly ACTIVE only. Cancel: REQUESTED or APPROVED.</text><text x="572" y="404" font-size="10" fill="#555">Each button shows only when its state allows it.</text><text x="572" y="434" font-size="12" font-weight="bold">History</text><text x="572" y="454" font-size="11">2026-10-25 09:15  APPROVED &gt; ACTIVE  Tran Thi B  HANDED_OVER</text><text x="572" y="472" font-size="11">2026-10-21 14:02  REQUESTED &gt; APPROVED  Tran Thi B</text><rect x="24" y="300" width="520" height="196" fill="#fafafa" stroke="#888"/><text x="36" y="324" font-size="13" font-weight="bold">Holder label  TL-0042 (dialog)</text><text x="40" y="348" font-size="11">Name</text><rect x="40" y="354" width="230" height="28" fill="#ffffff" stroke="#888"/><text x="48" y="373" font-size="12" fill="#555">Le Thi E</text><text x="284" y="348" font-size="11">Phone</text><rect x="284" y="354" width="244" height="28" fill="#ffffff" stroke="#888"/><text x="292" y="373" font-size="12" fill="#555">0912345678</text><text x="40" y="404" font-size="11">Emergency contact</text><rect x="40" y="410" width="488" height="28" fill="#ffffff" stroke="#888"/><text x="48" y="429" font-size="12" fill="#555">Le Van F, 0987654321</text><rect x="304" y="446" width="104" height="32" rx="4" fill="#ffffff" stroke="#2b5fab"/><text x="356.0" y="467.0" font-size="12" fill="#2b5fab" text-anchor="middle">Clear label</text><rect x="418" y="446" width="110" height="32" rx="4" fill="#2b5fab" stroke="#2b5fab"/><text x="473.0" y="467.0" font-size="12" fill="#ffffff" text-anchor="middle">Save</text><text x="24" y="520" font-size="11">Give notice dialog: 'The contract ends on 2026-11-25; 2 250 000 VND is due then.'</text><text x="24" y="538" font-size="11">Success: toast MSG18.  Cancel dialog with reason; success: toast MSG15.</text><text x="24" y="556" font-size="11">360 px: list rows become cards; the detail stacks balance, devices,</text><text x="24" y="574" font-size="11">actions as full-width buttons, then history.</text>
