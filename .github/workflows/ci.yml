name: CI

# TrekLink CI: lint, typecheck, unit test, and build the three workspace
# packages (backend, gateway, frontend), plus the backend HTTP e2e suite, on
# every PR and push to dev/main.
# See treklink-docs/_docs/01-conventions/07-github-workflow-git-conventions.md for the
# branch model this gates, and treklink-docs/_docs/00-project-context/01-project-charter.md §5
# for the NFR this satisfies ("Deployability: Docker Compose + GitHub Actions
# CI/CD"). Physical-hardware/LoRa tests (TP6, RQ1-RQ3) are NOT run here:
# those are manual/lab experiments, tracked separately in specs/*.

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: treklink
          POSTGRES_PASSWORD: treklink
          POSTGRES_DB: treklink_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U treklink"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://treklink:treklink@localhost:5432/treklink_test
      DATABASE_DIRECT_URL: postgresql://treklink:treklink@localhost:5432/treklink_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prisma generate
        run: npm --prefix backend run prisma:generate
      # Applies every migration to the Postgres 16 service container, so a migration that does not
      # run on the team database version fails CI (platform PR #12, leader decision 11).
      - name: Prisma migrate deploy
        run: npm --prefix backend run prisma:deploy
      # The demo seed loads on the migrated database and a second run creates nothing (platform 1.12,
      # US-X02). Passwords are generated per run, never committed.
      - name: Demo seed is idempotent
        run: |
          for role in ADMIN STAFF MANAGER OPERATOR; do
            export "SEED_${role}_PASSWORD=$(openssl rand -hex 12)"
          done
          export BCRYPT_COST=4
          npm --prefix backend run seed:demo
          npm --prefix backend run seed:demo -- --expect-unchanged
      - run: npm --prefix backend run lint
      - run: npm --prefix backend run typecheck
      - run: npm --prefix backend run test -- --ci --passWithNoTests
      - name: Backend database integration tests
        run: npm --prefix backend run test:db -- --ci
      # HTTP pipeline e2e (D-002 envelope, D-026 result.errorCode). PrismaService is stubbed,
      # so it needs no database; the service above supports migrations and database integration tests.
      # No --passWithNoTests: an empty e2e suite fails the job.
      - name: Backend e2e (database stubbed)
        run: npm --prefix backend run test:e2e -- --ci
      - run: npm --prefix backend run build

  gateway:
    name: Gateway Bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm --prefix gateway run lint
      - run: npm --prefix gateway run typecheck
      - run: npm --prefix gateway run test -- --ci --passWithNoTests
      - run: npm --prefix gateway run build

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run test
      - run: npm --prefix frontend run build

  # Playwright journeys of frontend task 10.1 on a throwaway Postgres 16: the demo seed, the backend with
  # the field data simulator (no MQTT broker, so MF-02, MF-03 and operator-360, which need the broker and
  # the gateway, stay manual), and the Vite dev server. The journeys change data, so this job never sees a
  # shared database; the passwords and the API key are generated per run and masked.
  e2e:
    name: Playwright (browser journeys)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: treklink
          POSTGRES_PASSWORD: treklink
          POSTGRES_DB: treklink_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U treklink -d treklink_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://treklink:treklink@localhost:5432/treklink_e2e
      DATABASE_DIRECT_URL: postgresql://treklink:treklink@localhost:5432/treklink_e2e
      MQTT_BROKER_URL: mqtt://localhost:1883
      MQTT_INGESTION_ENABLED: 'false'
      FIELD_SIMULATOR_ENABLED: 'true'
      # The demo control panel (a11y.spec.ts, /t/admin/demo); its guard holds because the database is loopback.
      DEMO_CONTROLS_ENABLED: 'true'
      BCRYPT_COST: '4'
      VITE_API_BASE_URL: http://localhost:3000/api
      VITE_WS_URL: http://localhost:3000
      E2E_BASE_URL: http://localhost:5173
      E2E_STUB_TILES: 'true'
      E2E_BACKEND_LOG: ${{ github.workspace }}/backend.log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate the seed credentials
        run: |
          for role in ADMIN STAFF MANAGER OPERATOR; do
            value="$(openssl rand -hex 12)"
            echo "::add-mask::${value}"
            echo "SEED_${role}_PASSWORD=${value}" >> "$GITHUB_ENV"
          done
          key="tlk_$(openssl rand -base64 33 | tr '+/' '-_' | tr -d '=\n' | cut -c1-43)"
          echo "::add-mask::${key}"
          echo "SEED_ORG_API_KEY=${key}" >> "$GITHUB_ENV"
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::${secret}"
          echo "JWT_ACCESS_SECRET=${secret}" >> "$GITHUB_ENV"
          master="$(openssl rand -hex 32)"
          echo "::add-mask::${master}"
          echo "CHANNEL_KEY_MASTER=${master}" >> "$GITHUB_ENV"
      - name: Prisma generate and migrate
        run: |
          npm --prefix backend run prisma:generate
          npm --prefix backend run prisma:deploy
      - name: Demo seed
        run: npm --prefix backend run seed:demo
      - name: Install Chromium
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Build and start the backend
        run: |
          npm --prefix backend run build
          nohup npm --prefix backend run start:prod > "$E2E_BACKEND_LOG" 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/api/health && exit 0
            sleep 2
          done
          cat "$E2E_BACKEND_LOG"
          exit 1
      - name: Start the Vite dev server
        run: |
          nohup npm --prefix frontend run dev > "${{ github.workspace }}/frontend.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:5173 && exit 0
            sleep 2
          done
          cat "${{ github.workspace }}/frontend.log"
          exit 1
      # The seed has to be older than gatewaySync.attributionMarginSeconds (5 minutes) before MF-03; these
      # journeys do not include MF-03, so no wait is needed here.
      - name: Playwright journeys
        working-directory: frontend
        run: npx playwright test --project=desktop a11y mf-01-request mf-01a mf-04 wf-04
      - name: Playwright release journey after MF-01 handover
        working-directory: frontend
        run: npx playwright test --project=desktop mf-05-term-end --grep 'WF-05 release:'
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
