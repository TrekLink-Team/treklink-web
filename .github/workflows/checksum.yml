name: Commit Checksum

# Checks the Checksum trailer on each commit of a pull request (D-054).
# Convention: treklink-docs _docs/01-conventions/07 §3.6. Advisory like all CI
# here (chapter 07 §7): a red check means merge with caution.
#
# Runs on pull_request (D-054 rule 4). pull_request_target is not used: it
# reads the workflow from the default branch (main) and GitHub disables it on
# public repositories from 2026-11-02. The keys are readable in capstone, so the
# secret needs no shielding from members; an edit to this file shows in review.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  checksum:
    uses: TrekLink-Team/treklink-docs/.github/workflows/checksum-verify.yml@dev
    secrets:
      TK_CHECKSUM_KEYS: ${{ secrets.TK_CHECKSUM_KEYS }}
