# Broker of the AWS field host (specs/platform/design.md §2.5, D-098). The go-auth part is the same as
# infra/mosquitto/mosquitto.auth.conf (gateway-sync design §4); the listeners differ:
# - 1883 without TLS, for the backend on the compose network only. compose.yml publishes no host port
#   for it, so it is unreachable from the internet.
# - 8883 with TLS, the only public listener, for nodes, phones and Field Stations. The certificate is
#   Caddy's, copied here by start.sh, which sends SIGHUP when Caddy renews it.
# There is no websocket listener. The broker reads the key after it drops to its user, so start.sh
# hands the copy to that user (checked against this image on 2026-11-07).

persistence true
persistence_location /mosquitto/data/
# The backend's persistent session (clean session off) keeps QoS 1 messages while the backend restarts.
# The default bound of 1000 would drop the rest of a large Field Station flush arriving during a restart.
max_queued_messages 10000

per_listener_settings false
allow_anonymous false

listener 1883

listener 8883
certfile /mosquitto/tls/server.crt
keyfile /mosquitto/tls/server.key

auth_plugin /mosquitto/go-auth.so
auth_opt_backends http
auth_opt_log_level info

auth_opt_http_host broker-hook-proxy
auth_opt_http_port 8080
auth_opt_http_getuser_uri /api/internal/mqtt/user
auth_opt_http_aclcheck_uri /api/internal/mqtt/acl
auth_opt_http_params_mode json
# Status mode: any 2xx allows, anything else denies (the hooks answer 200, 401 or 403).
auth_opt_http_response_mode status
auth_opt_http_timeout 5
# No superuser: every client goes through the ACL hook (design §4 has no superuser row).
auth_opt_disable_superuser true

# A revoked Field Station keeps a fresh connection for at most 60 s (gateway-sync design §4).
auth_opt_cache true
auth_opt_auth_cache_seconds 60
auth_opt_acl_cache_seconds 60
auth_opt_cache_refresh false
