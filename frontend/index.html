<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>TrekLink Operations Platform</title>
    <!-- Sets the theme before the first paint so a dark preference never flashes light
         (shared/lib/theme.ts owns the same key). -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('treklink.theme');
        } catch (error) {
          /* storage blocked: follow the operating system */
        }
        var prefersDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var theme = stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
