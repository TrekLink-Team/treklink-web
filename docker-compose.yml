services:
  postgres:
    image: postgres:16-alpine
    container_name: treklink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: treklink
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d treklink"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: treklink-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    # Open listeners for local development, with persistence so the backend's session survives a
    # broker restart (infra/mosquitto/mosquitto.conf)
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
